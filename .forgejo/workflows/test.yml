name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: codeberg-small
    container: golang:1.26
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...
